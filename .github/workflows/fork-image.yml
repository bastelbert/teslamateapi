name: fork-image

# builds the image of this fork (with charge cost write) and pushes it to ghcr.io/<owner>/teslamateapi
# the upstream workflow build.yml needs Docker Hub secrets and should be disabled in this fork

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "sql/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fork-image.yml"
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    if: github.repository != 'tobiasehlert/teslamateapi'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teslamate
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslamate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teslamate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 #v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: |
          go vet ./src/
          test -z "$(gofmt -l src)"

      - name: Test
        env:
          # disposable database of this job only
          TESLAMATEAPI_TEST_DATABASE_DSN: postgres://teslamate:test@localhost:5432/teslamate?sslmode=disable
        run: go test -race -count=1 -v ./src/

  image:
    name: image
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cost-write,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 #v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            apiVersion=cost-write-${{ github.sha }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
